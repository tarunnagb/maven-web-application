version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      docker: 19
    commands:
      - echo "Generating IMAGE_TAG from git commit SHA"
      - IMAGE_TAG=$(git rev-parse --short HEAD)
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - export IMAGE_TAG

      - echo "Determining target ECR repo and AWS region based on branch..."
      - |
        if [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/dev" ]; then
          TARGET_ECR_REPO=$ECR_REPO_DEV
          AWS_REGION=us-east-1
        elif [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/qa" ]; then
          TARGET_ECR_REPO=$ECR_REPO_QA
          AWS_REGION=us-east-1
        elif [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/develop" ]; then
          TARGET_ECR_REPO=$ECR_REPO_PROD
          AWS_REGION=ap-south-1
        else
          TARGET_ECR_REPO=$ECR_REPO_PROD
          AWS_REGION=ap-south-1
        fi
      - echo "Target ECR repo: $TARGET_ECR_REPO"
      - echo "Using AWS region: $AWS_REGION"
      - REGISTRY=$(echo $TARGET_ECR_REPO | cut -d '/' -f 1)
      - echo "Logging into ECR registry $REGISTRY..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
      - echo "Login successful."

  pre_build:
    commands:
      - echo "Running Maven build for branch $CODEBUILD_SOURCE_VERSION..."
      - |
        if [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/dev" ]; then
          echo "Using Maven profile 'dev'"
          mvn clean install -Pdev
        elif [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/qa" ]; then
          echo "Using Maven profile 'qa'"
          mvn clean install -Pqa
        elif [ "$CODEBUILD_SOURCE_VERSION" == "refs/heads/develop" ]; then
          echo "Using default Maven build"
          mvn clean install
        else
          echo "Branch unknown, using default Maven build"
          mvn clean install
        fi
      - echo "Running SonarQube analysis..."
      - mvn sonar:sonar -Dsonar.projectKey=my-project -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

  build:
    commands:
      - echo "Building Docker image with tag $IMAGE_TAG..."
      - docker build -t $REPONAME:$IMAGE_TAG .
      - echo "Tagging Docker image for ECR: $TARGET_ECR_REPO:$IMAGE_TAG"
      - docker tag REPONAME:$IMAGE_TAG $TARGET_ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image to ECR repo $TARGET_ECR_REPO..."
      - docker push $TARGET_ECR_REPO:$IMAGE_TAG
      - echo "Build and push completed at `date`."

artifacts:
  files:
    - target/**/*.war
